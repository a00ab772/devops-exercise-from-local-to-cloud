# https://github.com/marketplace/actions/amazon-ecs-deploy-task-definition-action-for-github-actions
name: Deploy to Amazon ECS

on:
  pull_request:
    branches: [ "main" ]
    types: [ closed ]

  workflow_dispatch: # Allows GitHub action to be manually triggered.

#  schedule:
#    - cron: '0 0 * * *'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: myapprepo
  ECS_SERVICE: devops-exercise-from-local-to-cloud-service
  ECS_CLUSTER: devops-exercise-from-local-to-cloud
  ECS_TASK_DEFINITION: ./task-definition.json
  CONTAINER_NAME: app

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Maven Test in main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Don't run Maven Test in other branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Run Checkstyle / Maven Verify
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:check verify

      - name: SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inject AWS Account ID into Task Definition
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          sed -i "s/__AWS_ACCOUNT_ID__/$AWS_ACCOUNT_ID/g" task-definition.json

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f docker/dockerfiles/app/multistage/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true